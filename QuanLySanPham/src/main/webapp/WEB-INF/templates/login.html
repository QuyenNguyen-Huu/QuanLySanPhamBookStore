<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Đăng nhập</title>
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
		crossorigin="anonymous"></script>
</head>
<body>
	<div class="container mt-5">
		<div class="row justify-content-center">
			<div class="col-md-5">
				<div class="card">
					<div class="card-header bg-primary text-white">Đăng nhập</div>
					<div class="card-body">
						<form th:action="@{/do-login}" method="post">
							<div class="mb-3">
								<label for="username" class="form-label">Tên đăng nhập</label>
								<input type="text" class="form-control" name="username" required>
							</div>
							<div class="mb-3">
								<label for="password" class="form-label">Mật khẩu</label>
								<input type="password" class="form-control" name="password" required>
							</div>
							<button type="submit" class="btn btn-primary w-100">Đăng nhập</button>
						</form>
						<!-- ✅ Thêm nút đăng nhập bằng Google ở đây -->
<div class="mb-3 text-center mt-3">
    <a href="/QuanLySanPham/oauth2/google" class="btn btn-danger w-100">
        <i class="bi bi-google"></i> Đăng nhập bằng Google
    </a>
</div>
						<p class="mt-3 text-center">
							Chưa có tài khoản? <a th:href="@{/register}">Đăng ký</a>
						</p>
					</div>
				</div>
			</div>
		</div>
	</div>
</body>
</html>
