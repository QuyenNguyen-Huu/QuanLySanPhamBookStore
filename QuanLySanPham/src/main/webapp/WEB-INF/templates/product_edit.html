<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<title>Sửa sản phẩm</title>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
	<style>
		body {
			background: #f8f9fa;
		}

		.card {
			max-width: 600px;
			margin: 40px auto;
			box-shadow: 0 4px 24px rgba(0, 0, 0, 0.08);
		}

		.form-label {
			font-weight: 500;
		}

		.btn-success {
			min-width: 140px;
		}

		.btn-danger {
			min-width: 100px;
		}
	</style>
</head>

<body>
	<div class="container">
		<div class="card">
			<div class="card-header bg-warning text-dark text-center">
				<h3 class="mb-0">Sửa thông tin sản phẩm</h3>
			</div>
			<div class="card-body">
				<form th:action="@{/products/edit/{id}(id=${product.id})}" accept-charset="UTF-8" th:object="${product}" method="post"
					enctype="multipart/form-data">
					
					<div class="mb-3">
    <label class="form-label">Ảnh mới (nếu muốn đổi/thêm)</label>
    <input type="file" class="form-control" name="imageFiles" multiple>
</div>

<div class="mb-3">
  <label class="form-label">Ảnh hiện tại:</label>
  <div class="d-flex flex-wrap gap-2">
    <!-- Ảnh chính -->
    <div th:if="${product.lazyloadedSrc != null}" class="d-flex flex-column align-items-center">
  <input type="checkbox" name="keepImages" th:value="${product.lazyloadedSrc}" checked>

  <!-- Ảnh chính - base64 -->
  <img th:if="${#strings.startsWith(product.lazyloadedSrc, 'data:image/')}" 
       th:src="${product.lazyloadedSrc}" 
       style="max-height: 100px;" 
       alt="Ảnh chính">

  <!-- Ảnh chính - dạng link -->
  <img th:if="${!#strings.startsWith(product.lazyloadedSrc, 'data:image/')}" 
       th:src="@{${product.lazyloadedSrc}}" 
       style="max-height: 100px;" 
       alt="Ảnh chính">
</div>

    <!-- Ảnh phụ -->
    <div th:if="${product.imagePaths != null}" th:each="img : ${product.imagePaths}" class="d-flex flex-column align-items-center">
  <input type="checkbox" name="keepImages" th:value="${img}" checked>

  <!-- Ảnh phụ - base64 -->
  <img th:if="${#strings.startsWith(img, 'data:image/')}" 
       th:src="${img}" 
       style="max-height: 100px;" 
       alt="Ảnh phụ">

  <!-- Ảnh phụ - dạng link -->
  <img th:if="${!#strings.startsWith(img, 'data:image/')}" 
       th:src="@{${img}}" 
       style="max-height: 100px;" 
       alt="Ảnh phụ">
</div>
  </div>
</div>

					<div class="mb-3">
						<label class="form-label">Tên sản phẩm</label>
						<input type="text" class="form-control" th:field="*{productNameNoEllipsis}" required>
					</div>

					<div class="mb-3">
						<label class="form-label">Số lượng</label>
						<input type="text" class="form-control" th:field="*{quantity}" required>
					</div>

					<div class="mb-3">
						<label class="form-label">Giá gốc</label>
						<input type="text" class="form-control" th:field="*{price2}" required>
					</div>

					<div class="mb-3">
						<label class="form-label">Giá khuyến mãi</label>
						<input type="text" class="form-control" th:field="*{price}">
					</div>

					<div class="mb-3">
						<label class="form-label">Danh mục</label>
						<select class="form-select" th:field="*{categoryId}">
							<option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
						</select>
					</div>

					<div class="mb-3">
						<label class="form-label">Thể loại</label>
						<div class="form-control" style="height: 200px; overflow-y: auto;">
							<div class="form-check" th:each="g : ${genres}">
								<input class="form-check-input" type="checkbox" th:value="${g.id}" th:field="*{genres}"
									th:checked="${product.genres.contains(g)}" th:id="'genre__' + ${g.id}" />
								<label class="form-check-label ms-1" th:attr="for='genre__' + ${g.id}"
									th:text="${g.name}"></label>
							</div>
						</div>
					</div>

					<div class="d-flex justify-content-between">
						<button type="submit" class="btn btn-success">Lưu thay đổi</button>
						<a th:href="@{/products}" class="btn btn-danger">Hủy</a>
					</div>
				</form>
			</div>
		</div>
	</div>
</body>

</html>
