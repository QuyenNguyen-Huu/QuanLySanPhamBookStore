<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thêm sản phẩm</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM"
		crossorigin="anonymous"></script>
    <style>
        body {
            background: #f8f9fa;
        }
        .card {
            max-width: 600px;
            margin: 40px auto;
            box-shadow: 0 4px 24px rgba(0,0,0,0.08);
        }
        .form-label {
            font-weight: 500;
        }
        .btn-success {
            min-width: 140px;
        }
        .btn-danger {
            min-width: 100px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <div class="card-header bg-primary text-white text-center">
            <h3 class="mb-0">Thêm sản phẩm mới</h3>
        </div>
        <div class="card-body">
            <form th:action="@{/products/add}" th:object="${product}"  accept-charset="UTF-8" method="post" enctype="multipart/form-data">
    <div class="mb-3">
        <label class="form-label">Ảnh sản phẩm</label>
        <input type="file" class="form-control" name="imageFiles"  multiple>
    </div>
    <div class="mb-3">
        <label class="form-label">Tên sản phẩm</label>
        <input type="text" class="form-control" th:field="*{productNameNoEllipsis}" >
        <div class="text-danger" th:if="${#fields.hasErrors('productNameNoEllipsis')}">
        <span th:errors="*{productNameNoEllipsis}"></span>
    </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Số lượng</label>
        <input type="text" class="form-control" th:field="*{quantity}" >
        <div class="text-danger" th:if="${#fields.hasErrors('quantity')}">
        <span th:errors="*{quantity}"></span>
    </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Giá gốc</label>
        <input type="text" class="form-control" th:field="*{price2}" >
         <div class="text-danger" th:if="${#fields.hasErrors('price2')}">
        <span th:errors="*{price}"></span>
    </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Giá khuyến mãi</label>
        <input type="text" class="form-control" th:field="*{price}">
        <div class="text-danger" th:if="${#fields.hasErrors('price')}">
        <span th:errors="*{price2}"></span>
    </div>
    </div>
    <div class="mb-3">
        <label class="form-label">Danh mục</label>
        <select class="form-select" th:field="*{categoryId}">
            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
        </select>
    </div>
    <div class="mb-3">
    <label class="form-label">Thể loại</label>
    <div class="form-control" style="height: 200px; overflow-y: auto;">
        <div class="form-check" th:each="g : ${genres}">
            <input class="form-check-input"
                   type="checkbox"
                   th:value="${g.id}"
                   th:field="*{genres}"
                   th:id="'genre__' + ${g.id}" />
            <label class="form-check-label ms-1"
                   th:attr="for='genre__' + ${g.id}"
                   th:text="${g.name}"></label>
        </div>
    </div>
</div>
    <div class="d-flex justify-content-between">
        <button type="submit" class="btn btn-success">Thêm sản phẩm</button>
        <a href="/products" class="btn btn-danger">Hủy thêm</a>
    </div>
</form>
        </div>
    </div>
</div>
</body>
</html>
